<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>客服时段接通报表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 中性色带冷偏（偏向蓝色强调色），不用无倾向灰。
   数据色：接起=牌照强调色，漏接=酒红（见下）。两块「漏接柱 / 非服务时间带」靠
   这两个变量上色，所以它们必须定义在 :root 里且不能被注释吃掉。
   2026-10-08 就吃过一次亏：上面那段说明的结尾多写了一个注释终止符，
   于是整个 :root 块被吞掉，--miss / --panel-2 全部解析成空，
   漏接柱和非服务时间带一齐渲染成纯黑（看着像配色难看，其实是变量没定义）。
   改这段注释时务必数一遍注释起始符与终止符的配对。

   班表人力(人)与接通率(比率)都不入话务量的轴，避免双轴误读。

   牌照配色（--acc-l / --acc-d 由 JS 按牌照内联注入，下面 .panel 负责按明暗挑一个）：
   每个牌照一个强调色，表格表头线、牌照色点、接起柱、图例共用它，所以一块里的
   「表格 ↔ 图表」是同一个颜色，扫一眼就知道哪张图配哪张表。
   牌照色按人工表观感取，直接量自人工表截图（青/蓝/玫瑰/沙金/绿），漏接统一用酒红，
   两者相邻着堆叠，所以一对一对都验过色差。实测（Viénot 1999 二色觉模拟 + CIEDE2000，
   算「该牌照强调色 vs 漏接酒红」，取正常/红/绿/蓝四者中最差的一个）：
     TBNZ #4cb8bc(浅) 42.6 ／ #5fe6eb(深) 31.7
     TBHK #128ee9 44.1 ／ #3fa8f5 32.4
     TBSG #db6a7b 19.7 ／ #ef8fa4 20.7
     TBAU #c09b67 24.6 ／ #e4c48f 25.0
     TFNZ #5ba53e 16.7 ／ #82cb6c 16.9
     合并块 #7b5ea7 29.2 ／ #a184c9 29.2
   小面积图形元素的经验线是 ΔE ≥15 稳、10~15 勉强、<10 不能用 —— 十二个都在 15 以上，
   最小是 TFNZ 浅色 16.7（绿和酒红本来就近，这是这套配色里最紧的一对）。
   截图的青/沙金两色压暗过一级：原色 #5fe6eb / #dfb478 跟白底对比度只有 1.5:1 / 1.9:1，
   柱子会糊在背景里，压暗后 2.4:1 / 2.6:1，够看清。
   牌照之间的相似度是次要线索（每块标题都写着牌照名），不再单独设限：
   红绿色盲下青(TBNZ)与蓝(TBHK)会偏近，但两者分属不同面板、各有文字标题。 */
:root {
  --ground:#eef0f4; --surface:#ffffff; --panel:#f6f7f9; --panel-2:#eceff3;
  --ink:#12151a; --ink-2:#464e5c; --ink-3:#6a7180;
  --line:#dfe3ea; --line-2:#c9cfd9;
  --ans:#2a78d6; --miss:#a8323f; --miss-ink:#8f2a36;
  --chip:#ffffff;
  /* 半透明派生色。本来是 color-mix() 现算，但 html2canvas（一键截图）解析不了它，
     所以改成每套主题各写一份 rgba。--glass 是吸顶表头的毛玻璃底
     （= --ground 92%），--row-even 是表格偶数行（= --panel 60%），
     --miss-bg / --miss-line 是备注框的底和边（= --miss 7% / 24%）。
     改上面任何一个基色，这四个要跟着一起改。 */
  --glass:rgba(238,240,244,.92); --row-even:rgba(246,247,249,.6);
  --miss-bg:rgba(168,50,63,.07); --miss-line:rgba(168,50,63,.24);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:#0e1116; --surface:#171b21; --panel:#1e232b; --panel-2:#262c36;
    --ink:#f2f4f7; --ink-2:#b6bdc9; --ink-3:#8b93a1;
    --line:#2a3039; --line-2:#3a424e;
    --ans:#3987e5; --miss:#c04a58; --miss-ink:#e08894;
    --chip:#1e232b;
    --glass:rgba(14,17,22,.92); --row-even:rgba(30,35,43,.6);
    --miss-bg:rgba(192,74,88,.1); --miss-line:rgba(192,74,88,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0e1116; --surface:#171b21; --panel:#1e232b; --panel-2:#262c36;
  --ink:#f2f4f7; --ink-2:#b6bdc9; --ink-3:#8b93a1;
  --line:#2a3039; --line-2:#3a424e;
  --ans:#3987e5; --miss:#c04a58; --miss-ink:#e08894;
  --chip:#1e232b;
  --glass:rgba(14,17,22,.92); --row-even:rgba(30,35,43,.6);
  --miss-bg:rgba(192,74,88,.1); --miss-line:rgba(192,74,88,.3);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 0 56px; padding-left: 16px; padding-right: 16px; }

/* ── 顶部 ─────────────────────────────── */
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
/* 这里原来写 color-mix()，改成按主题预置好的变量了。
   原因：一键截图用 html2canvas，它解析不了 color-mix()，碰到就整块不上色。
   半透明值挪到 :root 的 --glass / --row-even 里，明暗两套各自给一个，
   所以主题切换依然正确 —— 不是写死成浅色。 */
  background: var(--glass);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  margin-left: -16px; margin-right: -16px; padding: 12px 16px 10px;
}
.hrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--ink-3); font-size: 12px; font-family: var(--mono); }
.dateline { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.day-now { font-family: var(--mono); font-size: 15px; font-weight: 600; white-space: nowrap; }
.nav {
  background: var(--chip); color: var(--ink-2); border: 1px solid var(--line-2);
  width: 27px; height: 27px; border-radius: 7px; cursor: pointer;
  font: inherit; font-size: 13px; line-height: 1; display: grid; place-items: center;
}
.nav:hover:not(:disabled) { border-color: var(--ans); color: var(--ans); }
.nav:disabled { opacity: .4; cursor: default; }
.nav:focus-visible, .chip:focus-visible, .sg:focus-visible { outline: 2px solid var(--ans); outline-offset: 2px; }

/* 颗粒度切换 */
.seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 2px; gap: 2px; }
.sg {
  border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12px;
  padding: 3px 10px; border-radius: 6px; cursor: pointer;
}
.sg[aria-pressed="true"] {
  background: var(--surface); color: var(--ink); font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.09);
}
.dt {
  font: inherit; font-size: 12px; font-family: var(--mono); background: var(--chip);
  color: var(--ink); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 5px;
}

/* ── 区间条（兼作概览：按区间漏接总量染色） ── */
.strip-wrap { overflow-x: auto; margin-top: 10px; padding-bottom: 3px; }
.strip { display: flex; gap: 4px; min-width: max-content; }
.chip {
  background: var(--chip); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 7px 6px; cursor: pointer;
  font: inherit; text-align: center; min-width: 40px; color: var(--ink-2);
  display: grid; gap: 1px; line-height: 1.2;
}
.chip .w { font-size: 10px; color: var(--ink-3); letter-spacing: .02em; }
.chip .d { font-family: var(--mono); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.chip .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.chip[aria-current="true"] {
  border-color: var(--ans); box-shadow: inset 0 0 0 1px var(--ans); color: var(--ink);
}
.chip .n.has { color: var(--miss-ink); font-weight: 600; }

/* ── 面板 ─────────────────────────────── */
/* 牌照强调色：明暗各一个值内联注入，这里按当前主题挑 —— 内联样式写不了媒体查询，
   所以用两个自定义属性 + 媒体查询选择，而不是把颜色直接写进 --ans。 */
.panel {
  --ans: var(--acc-l, #2a78d6);
  background: var(--surface); border: 1px solid var(--line);
  border-top: 3px solid var(--ans);
  border-radius: 14px; padding: 16px 16px 6px; margin-top: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .panel { --ans: var(--acc-d, #3987e5); }
}
:root[data-theme="dark"] .panel { --ans: var(--acc-d, #3987e5); }

.ptop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pname { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
.pname::before {
  content: ''; width: 10px; height: 10px; border-radius: 3px;
  background: var(--ans); flex: none;
}
.psvc { color: var(--ink-3); font-size: 11.5px; font-family: var(--mono); text-align: right; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 13px 0 4px; }
@media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--panel); border-radius: 9px; padding: 8px 11px 9px; }
.kpi .k { color: var(--ink-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
.kpi .v { font-family: var(--mono); font-size: 18px; font-weight: 600; margin-top: 2px; }
.kpi .v.bad { color: var(--miss-ink); }
.kpi .v em { font-style: normal; font-size: 11px; font-weight: 400; color: var(--ink-3); }
.hcrow { color: var(--ink-3); font-size: 10.5px; display: flex; align-items: center; gap: 4px; margin-top: 1px; }
/* 班表人力可以直接在页面上填，存浏览器本地 —— 不用再改配置文件 */
.hc {
  width: 3.2em; font: inherit; font-family: var(--mono); font-size: 11px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 5px; padding: 0 3px; text-align: center; -moz-appearance: textfield;
}
.hc::-webkit-outer-spin-button, .hc::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hc:focus { outline: 2px solid var(--ans); outline-offset: 1px; }
/* 请假框窄一点：它多数时候是 0，不该跟人力抢视线 */
.hc.lvin { width: 2.6em; }
/* 「在岗 N 人」：没请假时这里只是个「人」字，请了假才显示实际在岗几人 */
.od { white-space: nowrap; }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
@media (max-width: 820px) { .charts { grid-template-columns: 1fr; } }
.ch { min-width: 0; }
.ct { font-size: 12.5px; font-weight: 600; }
.legend { display: flex; gap: 12px; align-items: center; margin: 3px 0 5px; flex-wrap: wrap; }
.lg { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: 11.5px; }
.sw { width: 9px; height: 9px; border-radius: 2.5px; }
svg { display: block; width: 100%; height: auto; }

.note {
  background: var(--miss-bg);
  border: 1px solid var(--miss-line);
  border-radius: 9px; padding: 8px 11px; font-size: 12px; color: var(--ink-2); margin-top: 11px;
}
.note b { font-family: var(--mono); color: var(--ink); }

/* ── 顶部红条：数据没更新时提醒 ──────────────────────────
   为什么要有：凭证过期时定时任务照跑，只是取不到数、不落盘，页面悄悄停在几天前。
   弹窗通知几秒就消失，人不一定在电脑前；而人每天都会打开这张报表 ——
   提醒放在这儿最不容易漏。有数据就整条隐藏，不占地方。 */
#healthbar {
  background: #fff4e5; border: 1px solid #f0b866; border-left: 4px solid #e08b00;
  border-radius: 8px; padding: 9px 12px; margin-bottom: 12px;
  font-size: 13px; color: #7a4400; line-height: 1.6;
}
#healthbar b { font-family: var(--mono); }
#healthbar .hb-t { font-weight: 600; margin-right: 4px; }
#healthbar .hb-s { color: #9a6a2a; font-size: 12px; }

/* ── 异常提示：放在页面最下面，**不进截图** ──────────────────
   为什么要有：数据是自动出的，人不再逐格看数，对数字的敏感度会下降。
   除了「低于 90% 标红」这条固定线，这里再主动挑出几类值得看一眼的波动。
   没检出就整块不显示 —— 平静的日子不该有噪音。 */
#alerts { margin: 14px 0 0; }
#alerts .ah { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
#alerts ul { margin: 0; padding-left: 18px; }
#alerts li { font-size: 12.5px; color: var(--ink); margin: 3px 0; line-height: 1.55; }
#alerts .tag {
  display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px;
  background: var(--miss-bg); border: 1px solid var(--miss-line);
  color: var(--ink-2); margin-right: 5px;
}
#alerts b { font-family: var(--mono); }
body.shot #alerts { display: none !important; }

/* ── 每块的「说明」：把每天要手写的那段话直接做进面板，所以它也进截图 ──
   和 .note 相反：.note 是给我自己看的口径脚注，截图时藏掉；
   .sum 是给别人看的结论，截图时必须留着，而且要是**纯文字**。
   编辑用的输入框另放在 .sumedit 里、截图时整行藏掉 —— 这样 html2canvas
   截到的永远是 div 里的文字，不依赖它渲染 input/textarea 的值（那条路不保险）。 */
.sum {
  background: var(--panel); border-left: 3px solid var(--ans);
  border-radius: 0 9px 9px 0; padding: 9px 12px; margin-top: 11px;
  font-size: 12.5px; line-height: 1.75; color: var(--ink-2);
  white-space: pre-wrap; word-break: break-word;
}
.sum .sh { color: var(--ink); font-weight: 600; }
.sum b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
.sum .lo { color: var(--miss-ink); }
/* 红字那行可点开编辑。加下划虚线提示「这里能改」，但别太扎眼 --
   截图里这行还要正常显示，所以只在鼠标移上去时明显起来。 */
.sum .lo[data-edit] { cursor: text; border-bottom: 1px dashed transparent; }
.sum .lo[data-edit]:hover { border-bottom-color: var(--miss-ink); }
.sum .lo .edited-tag { font-size: 10.5px; color: var(--ink-3); margin-left: 4px; }
body.shot .sum .lo .edited-tag { display: none; }
.noteedit {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px;
  font-family: var(--sans); line-height: 1.6; resize: vertical; min-height: 3.2em;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--ans); border-radius: 6px; padding: 4px 7px;
}
/* 口径小字：解释漏接取的是 ivr 日报真值，和上表逐格加总差几通 */
.sum .fine { color: var(--ink-3); font-size: 11.5px; }
/* 合并块整块的人力行：跟在两段量后面，空一行隔开，表示它说的是整块不是最后那个牌照 */
.sum .bhc { margin-top: 7px; }
.sumedit { display: flex; align-items: flex-start; gap: 7px; margin-top: 6px; flex-wrap: wrap; }
.sumedit label { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; padding-top: 4px; }
/* 合并面板（TBAU+TFNZ）的编辑区每个牌照一行，行首标出是哪个牌照 */
.sumedit label.un { color: var(--ink-2); font-weight: 600; min-width: 3.6em; }
.sumedit .why {
  flex: 1 1 320px; min-width: 200px; font: inherit; font-size: 12px;
  font-family: var(--sans); line-height: 1.6; resize: vertical; overflow: hidden;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 7px; padding: 4px 7px;
}
.sumedit .why:focus, .sumedit .hc:focus { outline: 2px solid var(--ans); outline-offset: 1px; }

/* 截图模式：藏掉备注和复制按钮这些只在屏幕上有用的东西，
   人力那行留着（截图里要看得到人力是多少），只是让输入框看起来像普通文字。 */
body.shot .note, body.shot .btnrow { display: none !important; }
/* 截图是发给别人看的成品，数据没更新的提示不该出现在里面 */
body.shot #healthbar { display: none !important; }
/* 说明的「编辑区」只在屏幕上用，截图里留纯文字那块（.sum）。 */
body.shot .sumedit { display: none !important; }
body.shot .hc { border-color: transparent; background: transparent; pointer-events: none; width: 2.4em; }
/* 截图里请假 0 没有信息量，藏掉「请假 0」只留人力；真请了假才显示出来。
   用 :not([value=""]) 不行 —— value 属性和用户输入后的实际值会脱节，
   所以靠 JS 在截图前给没请假的框加 .lv0。 */
body.shot .lvin.lv0, body.shot .lvlbl.lv0 { display: none !important; }
body.shot .hc.lvin { width: 2em; }

details { margin-top: 11px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 12px; padding: 3px 0; }
summary:focus-visible { outline: 2px solid var(--ans); outline-offset: 2px; }
.btn {
  background: var(--chip); color: var(--ink-2); border: 1px solid var(--line-2);
  border-radius: 7px; padding: 4px 10px; cursor: pointer;
  font: inherit; font-size: 11.5px; white-space: nowrap;
}
.btn:hover { border-color: var(--ans); color: var(--ans); }
.btn:focus-visible { outline: 2px solid var(--ans); outline-offset: 2px; }
.btn.ok, .btn[aria-pressed="true"] { border-color: var(--ans); color: var(--ans); }
.btnrow { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin: 12px 0 7px; }
.btnrow .hint { color: var(--ink-3); font-size: 11px; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--ground); border-radius: 9px;
  padding: 8px 15px; font-size: 12.5px; z-index: 50;
  opacity: 0; transition: opacity .14s; pointer-events: none;
}
#toast.show { opacity: 1; }
.sink { position: fixed; left: -9999px; top: 0; width: 10px; height: 10px; }
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 560px; }
th, td { padding: 4px 8px; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
th { color: var(--ink-3); font-weight: 500; font-size: 10.5px; font-family: var(--sans);
     text-transform: uppercase; letter-spacing: .04em; }
td:first-child, th:first-child, td.lic { text-align: left; }
td.lic { font-family: var(--sans); color: var(--ink-2); }
/* 这条就是你说的「表头有颜色的地方」——每块截图的上边界。
   原来是 color-mix(--ans 50%, --line-2) 调淡，但 html2canvas 解析不了 color-mix，
   截出来这条线会整条丢掉。--ans 是逐块注入的牌照色、没法预先算好混色值，
   所以直接用牌照色本身：截图里一定在，而且比原来调淡的版本更认得出是哪个牌照。 */
thead th { border-bottom: 1.5px solid var(--ans); }
tbody tr:nth-child(even) { background: var(--row-even); }
tr.closed td { color: var(--ink-3); }
tr.sub td { border-bottom: 1px solid var(--line); }
tr.tot td { border-top: 1px solid var(--line-2); font-weight: 600; }
td.bad { color: var(--miss-ink); font-weight: 600; }
.sep { border-left: 1px solid var(--line); }
.tag { font-family: var(--sans); font-size: 10px; color: var(--ink-3); }
footer { color: var(--ink-3); font-size: 11.5px; margin-top: 22px; line-height: 1.7; }
#tip {
  position: fixed; pointer-events: none; opacity: 0; transition: opacity .09s;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 9px; padding: 7px 10px; font-size: 12px; font-family: var(--mono);
  box-shadow: 0 6px 20px rgba(0,0,0,.16); z-index: 40; white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div id="healthbar" hidden></div>
    <div class="hrow">
      <h1>客服时段接通报表</h1>
      <span class="meta" id="meta"></span>
    </div>
    <div class="dateline">
      <div class="seg" id="modes" role="group" aria-label="统计颗粒度">
        <button class="sg" data-m="day" aria-pressed="false">日</button>
        <button class="sg" data-m="week" aria-pressed="false">周</button>
        <button class="sg" data-m="month" aria-pressed="false">月</button>
        <button class="sg" data-m="quarter" aria-pressed="false">季度</button>
        <button class="sg" data-m="custom" aria-pressed="false">自定义</button>
      </div>
      <button class="nav" id="prev" aria-label="上一个区间">‹</button>
      <button class="nav" id="next" aria-label="下一个区间">›</button>
      <span class="day-now" id="daynow"></span>
      <span id="customwrap" hidden>
        <input type="date" class="dt" id="cfrom" aria-label="起始日期">
        <span class="meta">至</span>
        <input type="date" class="dt" id="cto" aria-label="结束日期">
      </span>
    </div>
    <div class="dateline" style="margin-top:7px">
      <button class="btn" id="copyday">复制本区间全部牌照</button>
      <button class="btn" id="copysum">复制全部说明</button>
      <button class="btn" id="copyall">复制逐日全部数据</button>
      <button class="btn" id="exportprefs">导出我填的内容</button>
      <button class="btn" id="importprefs">导入</button>
      <input type="file" id="prefsfile" accept=".json,application/json" hidden>
      <button class="btn" id="shotbtn" aria-pressed="false">截图模式</button>
      <button class="btn" id="shotall">一键截图（每牌照一张）</button>
      <span class="meta" id="daysum"></span>
    </div>
    <div class="strip-wrap"><div class="strip" id="strip" role="tablist" aria-label="选择区间"></div></div>
  </header>
  <main id="app"></main>
  <section id="alerts"></section>
  <footer id="foot"></footer>
</div>
<div id="tip" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>

    return { phone: v, online: v };

  /* ── 分块：合并看还是拆开看 ───────────────
     合并块（TBAU+TFNZ）可以整块看，也可以拆成两块各自看；
     拆开时每块用自己牌照的强调色和自己的服务时间。

     服务时间优先取**这一天的**（b.svc / ms.svc），取不到才退回 D.groups 里的兜底值。
     因为 TBAU/TFNZ 的上班时间随澳洲/新西兰夏令时变（只变开始时间），
     而 D.groups 是按首日打的一份快照 —— 只认它的话，换季之后整段都显示成旧时间。
     多天区间取首日那天的值（区间跨换季的情况少，且表头本来就只能显示一行）。 */
  function panelsOf(blocks) {
    var out = [];
    D.groups.forEach(function (g, gi) {
      var b = blocks[gi];
      var canSplit = !!(g.multi && b.m.length > 1);
      if (canSplit && P.split[g.name]) {
        b.m.forEach(function (ms, k) {
          out.push({ name: ms.n, b: ms, multi: false, gi: gi, mi: k, canSplit: true,
                     group: g.name, hc: splitHc(g), dual: !!(g.hc || {}).dual,
                     svc: [ms.svc || (g.members[k] || {}).svc || {}], svcn: [ms.n] });
        });
        return;
      }
      var svc = [], svcn = [];
      if (canSplit) {
        // 合并块显示两条服务时间 —— 两个牌照上班时间不一样，只写「各牌照不同」等于没写
        g.members.forEach(function (m, k) {
          svc.push((b.m[k] || {}).svc || m.svc || {}); svcn.push(m.n);
        });
      } else { svc.push(b.svc || g.svc || {}); svcn.push(g.name); }
      out.push({ name: g.name, b: b, multi: canSplit, gi: gi, mi: -1, canSplit: canSplit,
                 group: g.name, hc: g.hc || {}, dual: !!(g.hc || {}).dual,
                 svc: svc, svcn: svcn });
    });
    return out;
  }

  /* ── 异常检测 ────────────────────────────────────────────
     数据既然是自动出的，人就不会再逐格盯着看，对数字的敏感度会下降。
     除了「接通率低于 90% 标红」这条固定线，这里再主动挑几类值得看一眼的。

     基线怎么来：同一个 (牌照, 渠道, 时段) 取**全部历史同时段**的中位数和 MAD
     （绝对偏差的中位数）。用中位数不用平均值，是因为话量本身偶尔爆一次，
     平均值会被那一次拽歪，之后就再也报不出同样的事。

     阈值是拿 74 天真实数据调出来的，目标是「几天才报一条」而不是天天响：
       · 单格突增  ≥ 中位+5×MAD 且 ≥ 中位×3 且 ≥12 通  → 74 天报 13 次
       · 漏接扎堆  单格漏接 ≥ 当天该渠道漏接的 40% 且 ≥5 通 → 平均每天 0.6 次
       · 连续爬升  连续 3 格递增、末格 ≥ 首格×2.5 且 ≥15 通，**并且末格相对同时段
                   基线也偏高** —— 少了最后这条，早上开工和午休后回升全会被报出来
                   （那是作息不是异常），实测 2.11 条/天 降到 0.12 条/天。
     放宽一档（3×MAD/2倍）会变成平均每天 1.9 条，那就成噪音了，人会直接忽略。

     只在**单日**视图下算。跨天区间里每格是多天累加，和单日基线不是一回事，
     硬比会满屏报警。 */
  var ALERT_MIN_DAYS = 10;      // 历史样本少于这个数就不判（基线不可靠）

  /* 午休时段（桶 11 = 11:31-12:30，桶 12 = 12:31-13:30）。
     74 天实测：这两格「接通率低于 90%」的发生率是 20% 和 17%，而前后相邻时段
     只有 7%~8% —— 午休轮班、在岗人力本来就少，是结构性的，不是哪天出了事。
     归因时点一句，省得每次都当成异常去查。 */
  var LUNCH = { 11: 1, 12: 1 };

  function medOf(a) {
    if (!a.length) return 0;
    var s = a.slice().sort(function (x, y) { return x - y; });
    var h = s.length >> 1;
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  }

  /* 某个 (牌照显示名, 渠道, 时段) 的历史基线。
     逐日遍历 D.data 现算 —— 74 天 × 4 块 × 24 格量级很小，不值得预先缓存。 */
  var baseCache = {};
  function baseline(name, ch, i) {
    var key = name + '|' + ch + '|' + i;
    if (baseCache[key]) return baseCache[key];
    var vals = [];
    D.days.forEach(function (d) {
      var blocks = D.data[d];
      if (!blocks) return;
      D.groups.forEach(function (g, gi) {
        var b = blocks[gi];
        if (!b) return;
        var units = [{ n: g.name, b: b }];
        (b.m || []).forEach(function (ms) { units.push({ n: ms.n, b: ms }); });
        units.forEach(function (u) {
          if (u.n !== name) return;
          var r = (u.b.r || [])[i];
          if (!r) return;
          if (!(ch === 'p' ? r[PIN] : r[OIN])) return;   // 非服务时段不进基线
          vals.push(ch === 'p' ? r[0] + r[1] : r[2] + r[3]);
        });
      });
    });
    var med = medOf(vals);
    var mad = medOf(vals.map(function (v) { return Math.abs(v - med); })) || 1;
    return (baseCache[key] = { n: vals.length, med: med, mad: mad });
  }

  /* 连续 N 个时段的合计 vs 历史同期均值。
     为什么单独做一个：单个半小时的量看着不高（10-21 TBSG 在线最高才 37 通），
     但**整段一起翻倍**才是真异常 —— 那天 11:30-14:30 合计 147 通，
     历史工作日平均只有 70.6，2.08 倍，是全期最异常的一天。
     可当时三个单点规则一个都没报（最高 37 没到「中位×3」），用户自己看出来的。

     做法：把某牌照某渠道连续 span 个时段的量加起来，和「同样这几个时段的
     历史均值之和」比。用均值不用中位数，是因为比的是**段合计**，
     段合计本身已经平滑过，均值更直观（也更好跟用户解释「平均多少」）。 */
  var SPAN_BASE = {};

  function spanBaseline(name, ch, start, span) {
    var key = name + '|' + ch + '|' + start + '|' + span;
    if (SPAN_BASE[key]) return SPAN_BASE[key];
    var sums = [];
    D.days.forEach(function (d) {
      var blocks = D.data[d];
      if (!blocks) return;
      D.groups.forEach(function (g, gi) {
        var b = blocks[gi];
        if (!b) return;
        var units = [{ n: g.name, b: b }];
        (b.m || []).forEach(function (ms) { units.push({ n: ms.n, b: ms }); });
        units.forEach(function (u) {
          if (u.n !== name) return;
          var tot = 0;
          for (var k = start; k < start + span; k++) {
            var r = (u.b.r || [])[k];
            if (!r) return;
            if (!(ch === 'p' ? r[PIN] : r[OIN])) return;   // 有非服务时段就整段不计
            tot += ch === 'p' ? r[0] + r[1] : r[2] + r[3];
          }
          sums.push(tot);
        });
      });
    });
    if (sums.length < ALERT_MIN_DAYS) return (SPAN_BASE[key] = null);
    var mean = sums.reduce(function (a, b) { return a + b; }, 0) / sums.length;
    var sd = Math.sqrt(sums.reduce(function (a, b) {
      return a + (b - mean) * (b - mean);
    }, 0) / sums.length);
    return (SPAN_BASE[key] = { n: sums.length, mean: mean, sd: sd });
  }

  function findAlerts(days) {
    if (days.length !== 1) return [];           // 只在单日视图下判，见上面说明
    var out = [];
    panels.forEach(function (p) {
      var units = [{ n: p.name, b: p.b }];
      if (p.multi) {
        units.length = 0;
        (p.b.m || []).forEach(function (ms) { units.push({ n: ms.n, b: ms }); });
      }
      units.forEach(function (u) {
        [['p', '电话', 0, 1, PIN], ['o', '在线', 2, 3, OIN]].forEach(function (cfg) {
          var ch = cfg[0], lab = cfg[1], ai = cfg[2], mi = cfg[3], ini = cfg[4];
          var rows = u.b.r || [];
          var dayMiss = 0;
          rows.forEach(function (r) { if (r[ini]) dayMiss += r[mi]; });

          rows.forEach(function (r, i) {
            if (!r[ini]) return;
            var vol = r[ai] + r[mi];

            var bl = baseline(u.n, ch, i);
            if (bl.n >= ALERT_MIN_DAYS && vol >= bl.med + 5 * bl.mad &&
                vol >= bl.med * 3 && vol >= 12) {
              out.push({ k: '话量突增', s: vol,
                t: u.n + ' ' + lab + ' <b>' + D.labels[i] + '</b> 来访 <b>' + vol +
                   '</b> 通，平时这个点大约 <b>' + bl.med + '</b> 通，接通率 ' +
                   (r[ai] / vol * 100).toFixed(0) + '%。' });
            }

            /* 门槛再加一条：当天该渠道漏接至少 8 通。
               否则「6 通里有 6 通集中在同一格」会报「占 100%」——
               数字没错，但量太小，没有看的价值（10-19 那次 TFNZ 就是 6/6）。
               漏接本来就稀少的牌照，每个都报一条只会淹掉真信号。 */
            if (dayMiss >= 8 && r[mi] >= 5 && r[mi] >= dayMiss * 0.4) {
              /* 「占当天 67%」这个说法有歧义 —— 分母只是**本渠道**（在线）全天的漏接，
                 不是当天电话+在线的全部。用户 2026-10-22 就按字面理解成了
                 「占当天全部漏接的 67%」，觉得对不上。改成写清分母是什么。 */
              out.push({ k: '漏接集中', s: r[mi],
                t: u.n + ' ' + lab + ' 漏接集中在 <b>' + D.labels[i] + '</b>：<b>' +
                   r[mi] + '</b> 通，占该牌照当天' + lab + '漏接（共 ' + dayMiss +
                   ' 通）的 ' + Math.round(r[mi] / dayMiss * 100) + '%。' });
            }
          });

          /* 连续 6 个时段（3 小时）的合计 vs 历史同期均值。
             阈值定 1.7 倍：先试过 1.5，太松 —— 10-19 那天一次报了 7 条，
             多数是「涨了五成」这种本来就常见的波动，看着像刷屏。1.7 之后
             抽查的 10 天里最多 3 条，报出来的都是真放量。 */
          var SPAN = 6, SPAN_RATIO = 1.7, SPAN_MIN = 40, best = null;
          for (var si = 0; si + SPAN <= rows.length; si++) {
            var seg = 0, ok = true;
            for (var k = si; k < si + SPAN; k++) {
              if (!rows[k][ini]) { ok = false; break; }
              seg += rows[k][ai] + rows[k][mi];
            }
            if (!ok || seg < SPAN_MIN) continue;
            var sb = spanBaseline(u.n, ch, si, SPAN);
            if (!sb || sb.mean <= 0) continue;
            var sr = seg / sb.mean;
            if (sr < SPAN_RATIO) continue;
            /* 去重：滑动窗口每一步都算一次，同一段会连着报六七条
               （起点挪一格就是一条），提示会被淹掉 —— 实测 10-21 一次报了 12 条。
               做法：每个 (牌照,渠道) 只保留**最严重的一条**，其余丢掉。
               用变量记在本轮里，等内层循环走完再统一 push。 */
            if (!best || sr > best.sr) {
              best = { sr: sr, si: si, seg: seg, mean: sb.mean };
            }
          }
          if (best) {
            out.push({ k: '整段放量', s: best.sr,
              t: u.n + ' ' + lab + ' <b>' + D.labels[best.si] + '</b> 起 ' + SPAN +
                 ' 个时段（3 小时）来访 <b>' + best.seg + '</b> 通，是平时（约 ' +
                 Math.round(best.mean) + ' 通）的 <b>' + best.sr.toFixed(1) + '</b> 倍。' });
          }

          for (var i = 2; i < rows.length; i++) {
            if (!rows[i][ini] || !rows[i - 1][ini] || !rows[i - 2][ini]) continue;
            var v0 = rows[i - 2][ai] + rows[i - 2][mi],
                v1 = rows[i - 1][ai] + rows[i - 1][mi],
                v2 = rows[i][ai] + rows[i][mi];
            if (!(v0 >= 3 && v0 < v1 && v1 < v2 && v2 >= v0 * 2.5 && v2 >= 15)) continue;
            /* 光看「自己比自己高」不行 —— 早上开工、午休后回升，话量本来就该爬，
               那是作息不是异常，不加这道约束会变成平均每天 2 条全是开工时段的废话。
               末格还得相对**同时段历史基线**偏高，才算真的反常（实测 2.11 → 0.12 条/天）。 */
            var bl2 = baseline(u.n, ch, i);
            if (bl2.n < ALERT_MIN_DAYS) continue;
            if (!(v2 >= bl2.med + 3 * bl2.mad && v2 >= bl2.med * 1.8)) continue;
            out.push({ k: '持续爬升', s: v2,
              t: u.n + ' ' + lab + ' 从 <b>' + D.labels[i - 2] + '</b> 起连续三个时段走高：' +
                 v0 + ' → ' + v1 + ' → <b>' + v2 + '</b> 通（平时这个点约 ' +
                 bl2.med + ' 通）。' });
          }
        });
      });
    });
    out.sort(function (a, b) { return a.k === b.k ? b.s - a.s : (a.k < b.k ? -1 : 1); });
    /* 「整段放量」最多留 2 条。一次全局性的量涨会让每个牌照、每个渠道各报一条
       （10-21 那天报了 5 条同类的），读起来像刷屏，反而看不到别的信号。
       按严重程度取前 2 就够了 —— 真要细看，表格里逐时段都有。 */
    var kept = 0;
    out = out.filter(function (a) {
      if (a.k !== '整段放量') return true;
      return ++kept <= 2;
    });
    return out;
  }

  function renderAlerts(days) {
    var box = document.getElementById('alerts');
    var list = findAlerts(days);
    if (!list.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="ah">这天有几处值得看一眼（自动挑的，不进截图）：</div><ul>' +
      list.map(function (a) {
        return '<li><span class="tag">' + a.k + '</span>' + a.t + '</li>';
      }).join('') + '</ul>';
  }

  /* 跨午夜的服务时间要写明「次日」，否则 08:00–05:00 看着像时间倒退。
     判据和后端 in_service() 一致：结束 <= 开始 就是跨夜。
     开始 == 结束（00:00–00:00）是 24 小时服务，直接写「24 小时」，
     不然会显示成「00:00–次日00:00」，绕。
     例：TBNZ 电话 08:00–次日05:00；TBAU 电话 06:00–14:00 不跨夜，不加字样。 */
  function svcHtml(p) {
    var mins = function (t) { var a = t.split(':'); return +a[0] * 60 + +a[1]; };
    var one = function (s) {
      var f = function (x) {
        if (!x || !x.length) return '—';
        var a = mins(x[0]), b = mins(x[1]);
        if (a === b) return '24 小时';
        return x[0] + '–' + (b <= a ? '次日' : '') + x[1];
      };
      return '电话 ' + f(s.phone) + '　在线 ' + f(s.online);
    };
    if (p.svc.length === 1) return '<div>服务时间 ' + esc(one(p.svc[0])) + '</div>';
    return p.svc.map(function (s, i) {
      return '<div>' + esc(p.svcn[i]) + '　' + esc(one(s)) + '</div>';
    }).join('');
  }

  /* 人均接起：区间里按「有话务的天数」取日均，单日就是它本身。
     hc 传的是**在岗人力**（编制 - 请假），由 onDuty() 算好再传进来。 */
  function perAgent(ans, hc, ad) {
    if (!hc || !ad) return null;
    return Math.round(ans / hc / ad * 100) / 100;
  }
  function getHc(name, ch, dflt) {
    var k = name + '|' + ch;
    // 存过就认存的（存了空串就是「故意不填」，不要再倒回配置里的默认值）
    if (Object.prototype.hasOwnProperty.call(P.hc, k)) return P.hc[k] === '' ? 0 : +P.hc[k];
    return +(dflt || 0);
  }
  // 请假人力，默认 0。**按「牌照|渠道|区间」存** —— 请假是一天一个数，
  // 不像编制那样长期不变。原来按「牌照|渠道」存，结果 9/29 填了请假 1，
  // 切到 10/08 还显示请假 1，说明里就会写出当天根本没发生的事。
  // 默认 0 意味着绝大多数日子什么都不用填。
  function getLv(name, ch, rk) {
    var v = P.lv[name + '|' + ch + '|' + rk];
    return v === '' || v === undefined ? 0 : +v;
  }
  /* 在岗人力 = 编制 - 请假，夹在 [0, 编制] 之间。
     请假填得比编制还多是手滑，按 0 算并在界面上标出来，不要算出负数或 Infinity。 */
  function onDuty(hc, lv) { return Math.max(0, hc - Math.max(0, lv)); }

  /* ── 每块的说明（就是每天要手写发群里的那段话）────────────────
     为什么做进页面而不是让人另写：那段话里**除了原因之外全是能从数据直接算出来的**
     —— 总量、接起、接通率、人力、请假、漏接集中在哪个时段。手抄既慢又容易抄错
     （对过 9/29 那份：TBSG 写成 113/85.0%，实际 112/85.7%）。
     算得出的部分自动填，只把「为什么」留给人填。

     口径说明（和表格不是同一个数，这点必须清楚）：
     · 「咨询总量」= 接起 + 漏接，漏接取 **ivr 日报真值**（mp[IVR]），不是上表的逐格加总。
       理由：发出去的说明是对外口径，要和报表系统的日报对得上；逐格加总是
       「能定位到时段的那部分」，天然可能偏少（见 noteHtml 那段）。
       全量 190 个牌照日验过：ivr 真值 **从不小于** 逐格加总，所以这样算不会把总量算少。
     · 两者不等时在说明里用小字点出差几通，不藏着。 */
  // 接通率低于它才需要写原因说明。和标红用的 D.alert（halfhour_config 的
  // ALERT_ANSWER_RATE）**现在是同一条线 0.90** —— 以前标红 0.95、写原因 0.90，
  // 93% 这种数字标着红却没有原因说明，看的人要在两条线之间来回换算。
  // 两个常数仍分开写：标红是配置项（页面上三处都读 D.alert），这个是文案规则。
  var SUM_EXPLAIN = 0.90;

  // 说明里的邮件量/原因按「牌照|区间」存：它们一天一个值，不像人力那样长期不变
  function rangeKey(days) {
    return days.length ? days[0] + '~' + days[days.length - 1] : '';
  }
  /* 邮件处理量。auto 是后台按天按牌照取回来的量（out/mail/），
     手填值**优先**于自动值：自动取不到的日子，或者人要覆盖，都还能填。
     手填成空串是「故意不写」，这时也不要倒回自动值 —— 和人力框一个脾气。 */
  function getMl(name, rk, auto) {
    var k = name + '|' + rk;
    if (Object.prototype.hasOwnProperty.call(P.ml, k)) {
      return P.ml[k] === '' ? null : +P.ml[k];
    }
    return (auto === null || auto === undefined) ? null : +auto;
  }
  function getWhy(name, rk) { return P.why[name + '|' + rk] || ''; }

  /* 漏接集中在哪几个时段：按漏接数从多到少取，取到累计过半就停，最多 3 个。
     「过半」是为了只说真正集中的那几格 —— 平摊在十几个时段时说哪个都没意义，
     这时它会返回 3 个也凑不满一半，调用方据此改口说「分散」。 */
  function topSlots(b, mi, ini) {
    var items = [];
    b.r.forEach(function (r, i) { if (r[mi] > 0) items.push({ i: i, n: r[mi], on: !!r[ini] }); });
    items.sort(function (a, c) { return c.n - a.n || a.i - c.i; });
    var tot = items.reduce(function (s, x) { return s + x.n; }, 0);
    var out = [], acc = 0;
    for (var k = 0; k < items.length && k < 3; k++) {
      out.push(items[k]); acc += items[k].n;
      if (acc * 2 >= tot) break;
    }
    return { list: out, acc: acc, tot: tot };
  }

  /* 说明里的人力那行。**「有效人力」只说一次** ——
     原来是「电话有效人力 5 人，请假 0 人；在线有效人力 6 人，请假 0 人」，
     同一个词出现两遍，读着像电话一拨人、在线另一拨人（用户反馈有歧义）。
     现在按块的性质分两种写法：

       双技能块（TBAU/TFNZ，配置里 dual:true）—— 同一批人两个渠道都接，
         就是一个数：「有效人力 4 人，请假 0 人」。
       普通块 —— 两个渠道人力本来就不同（如 5 和 6），数字不能丢，
         但词只说一次：「有效人力 电话 5 人 / 在线 6 人，请假 0 人」。

     请假同理：两边都没请假就只写一次「请假 0 人」；真请了假才标明是哪个渠道，
     并保留「（编制 5，请假 1）」这个括号 —— 编制和在岗的区别不能被合并掉。
     hc 是空对象（合并面板按牌照分述量的那两段）时返回空串，由面板整体出一行。
     lead/tail 给合并面板那行用：前面冠上块名、后面补一句「双技能」的解释。 */
  function hcLine(name, hc, dual, rk, lead, tail) {
    hc = hc || {};
    var hp = getHc(name, 'phone', hc.phone), lp = getLv(name, 'phone', rk);
    var ho = getHc(name, 'online', hc.online), lo = getLv(name, 'online', rk);
    var one = function (n, lv) {         // 单个渠道的「N 人」，请了假就带编制
      return onDuty(n, lv) + ' 人' + (lv > 0 ? '（编制 ' + n + '，请假 ' + lv + '）' : '');
    };
    var body;
    if (dual) {
      // 双技能：两个渠道存的是同一个数，取电话那个就行（没有才退到在线）
      var dh = hp || ho, dl = hp ? lp : lo;
      if (!dh) return '';
      body = one(dh, dl) + (tail || '') + (dl > 0 ? '' : '，请假 0 人');
    } else {
      var seg = [];
      if (hp) seg.push('电话 ' + one(hp, lp));
      if (ho) seg.push('在线 ' + one(ho, lo));
      if (!seg.length) return '';
      body = seg.join(' / ') + (tail || '') + (lp > 0 || lo > 0 ? '' : '，请假 0 人');
    }
    return '- ' + (lead || '') + '有效人力 ' + body;
  }

  /* 一个牌照单元的说明行。返回 [{t: 文本, lo: 是否标红}]。
     「单元」不等于「面板」：TBAU+TFNZ 合并成一个面板，但说明要分成两段写
     —— 发出去的那份是按牌照一条条列的，合在一起等于把两个牌照的量揉成一个数。 */
  function unitLines(u, rk) {
    var b = u.b, t = b.t, mp = b.mp;
    var L = [];
    var one = function (lab, ans, missTrue) {
      var tot = ans + missTrue;
      var r = tot ? ans / tot : null;
      L.push({ t: '- ' + lab + '咨询总量：' + tot + '　接起量：' + ans +
                  '　接通率 ' + (r === null ? '—' : (r * 100).toFixed(1) + '%'),
               lo: r !== null && r < SUM_EXPLAIN });
      return r;
    };
    // 电话漏接取 ivr 日报真值；在线报表那列本来就是准的，直接用
    var phoneMiss = Math.max(t[PM], mp[IVR]);
    var pr = one('电话', t[A], phoneMiss);
    var or_ = one('在线', t[OA], t[OM]);
    var ml = getMl(u.name, rk, b.ml);
    if (ml !== null) L.push({ t: '- 邮件处理量：' + ml });

    var hl = u.nohc ? '' : hcLine(u.name, u.hc, u.dual, rk);
    if (hl) L.push({ t: hl });

    // 低接通率说明里要带上「当天请假几人」。合并面板按牌照分述的那两段，人力和请假
    // 都记在整块名下（lvName），所以查请假得用整块那个名字，不是牌照名。
    var ln = u.lvName || u.name;
    var lp = getLv(ln, 'phone', rk), lo = getLv(ln, 'online', rk);

    /* 原因说明：只在接通率低于 90% 时出现（和人工写的习惯一致）。
       自动给的只有**事实**：漏接集中在哪几格、那几格是不是非服务时段、当天有没有请假。
       「为什么」留给人填 —— 我不替人断因，写死一句「坐席均在通话中」是在替人编理由。 */
    var low = [];
    if (pr !== null && pr < SUM_EXPLAIN) low.push(['电话', phoneMiss, PM, PIN]);
    if (or_ !== null && or_ < SUM_EXPLAIN) low.push(['在线', t[OM], OM, OIN]);
    low.forEach(function (c) {
      var lab = c[0], total = c[1], ts = topSlots(b, c[2], c[3]);
      var ai = c[0] === '电话' ? 0 : 2;

      /* ── 低接通时补一句能动手的结论 ──────────────────────
         起因：突然哪个时段低于 90% 了，单看数字看不出为什么，需要有句话说清
         「是不是话量涨上来了」。判断依据是漏接最集中那一格的话量 vs
         **同牌照同时段的历史中位数**（不是跟当天别的时段比 —— 午休本来就比
         上午少，横着比没意义）。

         用户 2026-10-20 要求去掉「来访 X 通、是平时 Y 通的 Z 倍」那段 ——
         括号里已经有通数了，倍数属于重复解释，嫌啰嗦。所以：
           · 量比平时高   → 什么都不补，括号里的通数本身已经说明问题；
           · 量没涨       → 只补一句「量没涨却没接住」，**这反而是要人去查的**：
             同样的量以前接得住、这次没接住，多半是人手或业务时长的问题。
             量明显低于平时也归这一类，而且更可疑 —— 量少反而接不住，通常是
             那段时间根本没人在线（09-13 周日 TBSG 在线 11 通对平时 20 通、
             却一通没接起，就是这种）。
         1.2 和 1.5 之间故意不写：量涨了三五成，既算不上爆量也算不上没涨。 */
      var pk = ts.list.length ? ts.list[0] : null;
      var tail = '';
      if (pk && pk.on) {
        var pb = baseline(u.name, c[0] === '电话' ? 'p' : 'o', pk.i);
        if (pb.n >= ALERT_MIN_DAYS && pb.med > 0) {
          var pv = b.r[pk.i][ai] + b.r[pk.i][c[2]];
          if (pv / pb.med <= 1.2) {
            tail = '量没涨却没接住，' +
                   (LUNCH[pk.i] ? '这格是午休时段，在岗人力本来就少；' : '') +
                   '要看当时的在岗和通话时长。';
          }
        }
      }

      var s = lab + '接通率说明：漏接 ' + total + ' 通';
      if (!ts.list.length) {
        s += '（没有定位到具体时段）';
      } else if (ts.acc * 2 >= ts.tot) {
        /* 括号要留着：并列多个时段时，没有括号会读成
           「…16 通、15:31-16:30 12 通」，断不开句。 */
        s += '，主要集中在 ' + ts.list.map(function (x) {
          return D.labels[x.i] + '（' + x.n + ' 通' + (x.on ? '' : '，非服务时段') + '）';
        }).join('、') + '。';
      } else {
        s += '，分散在多个时段，最多的是 ' + D.labels[ts.list[0].i] +
             '（' + ts.list[0].n + ' 通）';
      }
      s += tail;
      // 漏接比逐格加总多的那部分定位不到时段，说明里要交代，不能让人以为上面列全了
      if (lab === '电话' && phoneMiss > t[PM]) {
        s += '其中 ' + (phoneMiss - t[PM]) + ' 通定位不到具体时段。';
      }
      // 双技能块两个渠道存的是同一个数，写成「电话请假 1 人、在线请假 1 人」
      // 等于把同一个人数两遍，只写一次「请假 1 人」
      if (u.dual && lp > 0) {
        s += '当天请假 ' + lp + ' 人。';
      } else if (lp > 0 || lo > 0) {
        s += '当天' + (lp > 0 ? '电话请假 ' + lp + ' 人' : '') +
             (lp > 0 && lo > 0 ? '、' : '') + (lo > 0 ? '在线请假 ' + lo + ' 人' : '') + '。';
      }
      var why = getWhy(u.name, rk);
      if (why) s += why.replace(/\s+$/, '');
      L.push({ t: s, lo: true, k: lab });
    });

    /* 接通率**不低于 90%** 时，上面那段「接通率说明」不会生成 —— 但人可能
       还是想留一句话（比如「当天系统升级」「节假日」「临时活动」）。
       原来填了也白填：P.why 存下来了，却只在 low 那几行里取用，于是高接通率
       的日子备注消失（用户 2026-10-22 报的：「备注了但不会往上面显示」）。

       现在：只要填过，不管接通率多少都单独出一行。前缀用「当班说明」而不是
       「原因说明」，免得看着像在解释一个并不低的接通率。 */
    if (!low.length) {
      var w2 = getWhy(u.name, rk);
      if (w2) L.push({ t: '当班说明：' + w2.replace(/\s+$/, ''), lo: false });
    }
    return L;
  }

  /* 一个面板里要分开写说明的牌照单元。合并面板（TBAU+TFNZ）拆成两个，其余就它自己。
     **合并着看**的时候成员 hc 传空对象：整块的 4 人是两个牌照共用的，
     安到单个牌照头上就等于说每家各 4 人（合计 8 个虚岗），说明里会写出错数。
     整块自己的人力行由 blockHcLine() 在两段量后面统一出一行 ——
     以前这儿什么都不出，合并看时说明里干脆没有人力（用户报过「合并后就没有这句话了」）。
     真要看各牌照的人力，点「拆开单看」，那条路走 splitHc()，各 3 人。 */
  function sumUnits(p) {
    if (p.multi && p.b.m && p.b.m.length > 1) {
      // nohc：这两段**完全不出**人力行。只传 hc:{} 不够 —— getHc 会去 P.hc 里
      // 找「TBAU|phone」，而那个键是拆开单看时改出来的，于是合并看也跟着冒出
      // 「TBAU 有效人力 5 人」，和整块那行 4 人自相矛盾。
      return p.b.m.map(function (m) {
        return { name: m.n, b: m, hc: {}, nohc: true, dual: p.dual, lvName: p.name };
      });
    }
    return [{ name: p.name, b: p.b, hc: p.hc || {}, dual: p.dual }];
  }

  /* 合并面板整块的人力行。只有合并着看时才有 —— 不合并的面板，人力行已经
     跟在它自己那段量后面了，再出一行就是重复。
     双技能块后面补一句解释，免得「4 人」被当成电话 4 人、在线另有 4 人。 */
  function blockHcLine(p, rk) {
    if (!(p.multi && p.b.m && p.b.m.length > 1)) return '';
    return hcLine(p.name, p.hc, p.dual, rk,
                  p.name + '　',
                  p.dual ? '（双技能，电话和在线是同一批人）' : '');
  }

  function dayLabel(days) {
    return days.length === 1 ? days[0] + ' 周' + wdOf(days[0])
                             : rangeKey(days) + '（' + days.length + ' 天）';
  }

  function sumText(p, days) {
    var rk = rangeKey(days), us = sumUnits(p);
    var out = [];
    us.forEach(function (u, i) {
      out.push((i ? '\n' : '') + u.name + '　' + dayLabel(days));
      unitLines(u, rk).forEach(function (l) { out.push(l.t); });
    });
    var bh = blockHcLine(p, rk);
    if (bh) out.push('\n' + bh);
    return out.join('\n');
  }

  function sumHtml(p, days) {
    var rk = rangeKey(days), us = sumUnits(p);
    var body = us.map(function (u) {
      return '<div class="sh">' + esc(u.name + '　' + dayLabel(days)) + '</div>' +
        unitLines(u, rk).map(function (l) {
          /* 低于 90% 那几行（.lo）点一下就变成可编辑 —— 用户要能把自动生成的那段
             改成自己的话。data-edit / data-lk 只在这一行上，不影响别的说明行。

             改过的行整行用改的（P.note），不再显示自动生成的内容 —— 否则
             「自动那半句 + 人改的半句」会拼在一起，读着自相矛盾。 */
          /* 只有「接通率说明」那几行给了 l.k（'电话' / '在线'）—— 总量行虽然
             也会因为低于 90% 标红，但它是纯事实（总量/接起/率），不该改。
             用「有没有 k」来区分：有 k 才可编辑。 */
          var editable = !!(l.lo && l.k);
          if (!editable) {
            return '<div' + (l.lo ? ' class="lo"' : '') + '>' + esc(l.t) + '</div>';
          }
          var nk = u.name + '|' + rk + '|' + l.k;
          var custom = Object.prototype.hasOwnProperty.call(P.note, nk);
          var txt = custom ? P.note[nk] : l.t;
          return '<div class="lo' + (custom ? ' edited' : '') + '" data-edit="1"' +
                 ' data-lk="' + esc(u.name) + '|' + esc(l.k) + '"' +
                 ' title="' + (custom ? '已手改，点击可再改' : '点击可修改') + '">' +
                 esc(txt) +
                 (custom ? '<span class="edited-tag">（已手改）</span>' : '') + '</div>';
        }).join('');
    }).join('');
    var bh = blockHcLine(p, rk);
    if (bh) body += '<div class="bhc">' + esc(bh) + '</div>';
    var edits = us.map(function (u) {
      // 框里只放**手填过的**值；没填过就留空，placeholder 显示自动取到的量。
      // 这样一眼能看出「这个数是系统取的」还是「这个数是人改的」。
      var mk = u.name + '|' + rk;
      var hand = Object.prototype.hasOwnProperty.call(P.ml, mk) ? P.ml[mk] : '';
      var auto = (u.b || {}).ml;
      return '<div class="sumedit" data-u="' + esc(u.name) + '">' +
        (us.length > 1 ? '<label class="un">' + esc(u.name) + '</label>' : '') +
        '<label>邮件量</label>' +
        '<input class="hc ml" type="number" min="0" step="1" value="' +
          esc(String(hand)) + '" placeholder="' +
          (auto === null || auto === undefined ? '—' : auto) + '" aria-label="' +
          esc(u.name) + '邮件处理量">' +
        '<label>原因说明</label>' +
        '<textarea class="why" rows="1" aria-label="' + esc(u.name) + '接通率原因说明" ' +
          'placeholder="接通率低于 90% 时补一句原因">' + esc(getWhy(u.name, rk)) + '</textarea>' +
        '</div>';
    }).join('');
    return '<div class="sum">' + body + '</div>' + edits +
      '<div class="sumedit"><button class="btn cpsum">复制这段说明</button></div>';
  }


  /* 顶端 4px 圆角、底边贴基线 */
  function bar(x, y, w, h, r) {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return '<path d="M' + x + ' ' + (y + h) + 'V' + (y + r) + 'a' + r + ' ' + r +
      ' 0 0 1 ' + r + ' ' + (-r) + 'h' + (w - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' +
      r + ' ' + r + 'V' + (y + h) + 'Z"';
  }

  /* 堆叠柱：接起在下、漏接在上，中间 2px 表面缝；非服务时段用背景带；
     低于阈值的时段直接标出接通率（选择性标注，不是每格都标） */
  function chart(rows, ai, mi, ini, ymax) {
    var W = 560, H = 198, ml = 30, mr = 6, mt = 18, mb = 42;
    var n = rows.length, iw = W - ml - mr, ih = H - mt - mb;
    var gap = iw / n, bw = Math.min(19, gap - 5), base = mt + ih;
    var s = ['<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="逐时段接起与漏接">'];
    rows.forEach(function (r, i) {
      if (r[ini]) return;
      s.push('<rect x="' + (ml + i * gap).toFixed(1) + '" y="' + mt + '" width="' + gap.toFixed(1) +
        '" height="' + ih + '" fill="var(--panel-2)"/>');
    });
    for (var t = 0; t <= 4; t++) {
      var y = base - ih * t / 4;
      s.push('<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y.toFixed(1) + '" y2="' +
        y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>');
      s.push('<text x="' + (ml - 5) + '" y="' + (y + 3.5).toFixed(1) +
        '" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--ink-3)">' +
        Math.round(ymax * t / 4) + '</text>');
    }
    rows.forEach(function (r, i) {
      var a = r[ai], m = r[mi];
      var x = ml + i * gap + (gap - bw) / 2;
      var ha = ih * a / ymax, hm = ih * m / ymax, ya = base - ha;
      if (m > 0) {
        var ym = ya - 2 - hm;
        s.push('<' + bar(x, ym, bw, hm, 4) + ' fill="var(--miss)"/>');
        if (a > 0) s.push('<rect x="' + x.toFixed(1) + '" y="' + ya.toFixed(1) + '" width="' +
          bw.toFixed(1) + '" height="' + ha.toFixed(1) + '" fill="var(--ans)"/>');
      } else if (a > 0) {
        s.push('<' + bar(x, ya, bw, ha, 4) + ' fill="var(--ans)"/>');
      }
      var rt = rate(a, m);
      if (rt !== null && rt < D.alert) {
        s.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' +
          ((m > 0 ? ya - 2 - hm : ya) - 5).toFixed(1) +
          '" text-anchor="middle" font-size="9.5" font-weight="600" font-family="var(--mono)" ' +
          'fill="var(--miss)">' + pct(rt) + '</text>');
      }
      s.push('<rect class="hit" data-i="' + i + '" x="' + (ml + i * gap).toFixed(1) + '" y="' + mt +
        '" width="' + gap.toFixed(1) + '" height="' + ih + '" fill="transparent"/>');
    });
    s.push('<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + base + '" y2="' + base +
      '" stroke="var(--line-2)" stroke-width="1"/>');
    rows.forEach(function (r, i) {
      if (i % 3) return;
      var cx = ml + i * gap + gap / 2;
      s.push('<text x="' + cx.toFixed(1) + '" y="' + (base + 13) +
        '" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink-3)" ' +
        'transform="rotate(-45 ' + cx.toFixed(1) + ' ' + (base + 13) + ')">' +
        D.labels[i].slice(0, 5) + '</text>');
    });
    s.push('</svg>');
    return s.join('');
  }

  function lgd() {
    return '<div class="legend">' +
      '<span class="lg"><i class="sw" style="background:var(--ans)"></i>接起量</span>' +
      '<span class="lg"><i class="sw" style="background:var(--miss)"></i>漏接量</span>' +
      '<span class="lg"><i class="sw" style="background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)"></i>非服务时间</span>' +
      '</div>';
  }

  function cells(r) {
    var pr = rate(r[A], r[PM]), or_ = rate(r[OA], r[OM]);
    return '<td>' + r[A] + '</td>' +
      '<td' + (r[PM] ? ' class="bad"' : '') + '>' + r[PM] + '</td>' +
      '<td' + (pr !== null && pr < D.alert ? ' class="bad"' : '') + '>' + pct(pr) + '</td>' +
      '<td class="sep">' + r[OA] + '</td>' +
      '<td' + (r[OM] ? ' class="bad"' : '') + '>' + r[OM] + '</td>' +
      '<td' + (or_ !== null && or_ < D.alert ? ' class="bad"' : '') + '>' + pct(or_) + '</td>';
  }

  /* 合计行的列数必须跟表头严格一致，否则整行会整体右移一格对不上表头
     —— 之前不分牌照的表也写了 colspan="2"，就错在这。
     表头是「时段」1 列（不分牌照）或「时段 + 牌照」2 列（分牌照）。 */
  function totRow(t, label, lic, multi) {
    var pr = rate(t[A], t[PM]), or_ = rate(t[OA], t[OM]);
    var head = lic !== undefined
      ? '<td>' + esc(label) + '</td><td class="lic">' + esc(lic) + '</td>'
      : (multi ? '<td colspan="2">' + esc(label) + '</td>' : '<td>' + esc(label) + '</td>');
    return '<tr class="tot">' + head +
      '<td>' + t[A] + '</td><td' + (t[PM] ? ' class="bad"' : '') + '>' + t[PM] + '</td><td>' +
      pct(pr, 1) + '</td><td class="sep">' + t[OA] + '</td><td' + (t[OM] ? ' class="bad"' : '') +
      '>' + t[OM] + '</td><td>' + pct(or_, 1) + '</td></tr>';
  }

  function table(p) {
    var b = p.b, multi = p.multi;
    var s = ['<details open><summary>逐时段明细表（24 个时段）</summary><div class="tscroll"><table><thead><tr>',
      '<th rowspan="2">时段</th>', multi ? '<th rowspan="2">牌照</th>' : '',
      '<th colspan="3">电话</th><th colspan="3" class="sep">在线</th></tr><tr>',
      '<th>接起</th><th>漏接</th><th>接通率</th>',
      '<th class="sep">接起</th><th>漏接</th><th>接通率</th></tr></thead><tbody>'];
    b.r.forEach(function (r, i) {
      var closed = !r[PIN] && !r[OIN];
      var lab = esc(D.labels[i]) + (closed ? ' <span class="tag">非服务</span>' : '');
      if (!multi) {
        s.push('<tr' + (closed ? ' class="closed"' : '') + '><td>' + lab + '</td>' + cells(r) + '</tr>');
        return;
      }
      /* 合并块不再逐时段出「小计」行 —— 24 个时段就有 24 行小计，把明细淹掉了。
         每个牌照的末行已经是各自的「合计」，块末再出块合计 + 各牌照合计，读起来是
         「合计 / 合计 / 总计」三层，跟人工表的排法一致。 */
      b.m.forEach(function (m, k) {
        var mr = m.r[i], mc = !mr[PIN] && !mr[OIN];
        s.push('<tr' + (mc ? ' class="closed"' : '') + '>' +
          (k === 0 ? '<td rowspan="' + b.m.length + '">' + lab + '</td>' : '') +
          '<td class="lic">' + esc(m.n) + '</td>' + cells(mr) + '</tr>');
      });
    });
    /* 合并块的三行收尾：先各牌照「合计」，最后整块「总计」——
       三行都写「合计」看不出谁是谁，所以要分开标。 */
    if (multi) {
      b.m.forEach(function (m) { s.push(totRow(m.t, '合计', m.n, multi)); });
      s.push(totRow(b.t, '总计', undefined, multi));
    } else {
      s.push(totRow(b.t, '合计', undefined, multi));
    }
    s.push('</tbody></table></div></details>');
    return s.join('');
  }

  /* 表下面那段备注。要回答的就一个问题：
     「上面大数字写 65.6%，表里合计那行写 66.6%，到底哪个对？」
     答案是两个都对，只是分母不一样 —— 大数字用 ivr 日报的漏接真值（和源系统一致），
     表里只能装下「能定位到具体时段」的那部分漏接。所以这段话先摆日报口径的
     排队放弃 / 其他漏接（真值），再说清楚少掉的那几通为什么进不了表。 */
  function noteHtml(p) {
    var b = p.b, t = b.t, mp = b.mp;
    if (!t[PM] && !mp[GAP]) return '';
    var ivr = Math.max(t[PM], mp[IVR]);
    // 日报真值的两项。老数据的 mp 只有 6 位（没有 QUE_T），取不到就退回逐格值，
    // 免得旧归档打开后这里显示 undefined。
    var qT = mp[QUE_T] === undefined ? mp[1] : mp[QUE_T];
    var oT = mp[OTH_T] === undefined ? mp[0] : mp[OTH_T];
    var s = '电话漏接 <b>' + ivr + '</b> 通（与源系统日报一致）' +
            '＝ 排队放弃 <b>' + qT + '</b> ＋ 其他漏接 <b>' + oT + '</b>。';
    /* 少掉的那几通到底少在哪一项，按真值减逐格各自算出来，不写死一句
       「明细不全」—— 比如 TBAU+TFNZ 少的那 2 通其实全是排队放弃，
       写成其他漏接就是把原因说反了。
       判断「要不要写这段」用的是分项差额 dq+doh，不是 mp[GAP]：GAP 是**逐日**
       算完再累加的，某天少 1 通、另一天多 1 通，跨天合计时 GAP 仍是 1，可逐格
       总数其实已经等于真值了。这时还按 GAP 写，就会出现「表里只有 236 通 ——
       另外 1 通查不到」这种自相矛盾的话（236 就是真值本身）。

       **措辞要能直接对外用**（2026-10-20 用户：「漏接 25、明细只有 13，
       我怎么解释呢」）。所以不提系统内部的表名，只说两件事：
       这几通没有发生时间、所以摆不进按时段切的表。 */
    var dq = Math.max(0, qT - mp[1]), doh = Math.max(0, oT - mp[0]);
    if (dq || doh) {
      /* 只有一项缺时就直接说那一项，别再写「共 N 通」—— 两个数一样，
         写出来是「其他漏接 12 通共 12 通」，读着像卡带。 */
      var why = [];
      if (dq) why.push('排队放弃 ' + dq + ' 通' +
        (b.nd ? '（' + (b.nd >= b.nday ? (b.nday > 1 ? '这段时间' : '这天') + '数据缺失'
                                       : '其中 ' + b.nd + ' 天数据缺失') + '）' : ''));
      if (doh) why.push('其他漏接 ' + doh + ' 通');
      var missTxt = why.join('、') + (why.length > 1 ? '，共 ' + (dq + doh) + ' 通' : '');
      s += '<br>按时段拆开只能摆出 <b>' + t[PM] + '</b> 通，剩下的 <b>' +
        missTxt + '</b> 源系统只给了当天总数、没有逐通的发生时间，没法归到某个时段。' +
        '所以表格最后一行的接通率会比上面的大数字高一些 —— ' +
        '<b>对外以上面的大数字为准</b>，表格用来看漏接集中在哪几个时段。';
    } else {
      s += '两项都已落到具体时段，表格逐行加起来和上面的大数字一致。';
    }
    return '<div class="note">' + s + '</div>';
  }

  /* ── 复制成 Excel 能直接粘的制表符分隔文本 ──────────────
     列：日期 时段 牌照 电话接起 电话漏接 电话接通率 在线接起 在线漏接 在线接通率
     率为空的格子留空（不写「—」），粘进表里才不会变成文本。
     跨天区间时「日期」列写成 起始~结束。 */
  var TSV_HEAD = ['日期', '时段', '牌照', '电话接起量', '电话漏接量', '电话该渠道接通率',
                  '在线接起量', '在线漏接量', '在线该渠道接通率'];

  function rstr(v, d) { return v === null ? '' : (v * 100).toFixed(d === undefined ? 0 : d) + '%'; }

  function dateCol(days) {
    if (!days.length) return '';
    return days.length === 1 ? days[0] : days[0] + '~' + days[days.length - 1];
  }

  function tsvRows(p, dcol, withHead) {
    var b = p.b;
    var out = withHead ? [TSV_HEAD.slice()] : [];
    var line = function (lab, lic, r, d) {
      out.push([dcol, lab, lic, r[A], r[PM], rstr(rate(r[A], r[PM]), d),
                r[OA], r[OM], rstr(rate(r[OA], r[OM]), d)]);
    };
    b.r.forEach(function (r, i) {
      if (!p.multi) { line(D.labels[i], p.name, r); return; }
      b.m.forEach(function (m) { line(D.labels[i], m.n, m.r[i]); });
    });
    if (!p.multi) line('总计', p.name, b.t, 1);
    else {
      b.m.forEach(function (m) { line('总计', m.n, m.t, 1); });
      line('总计', p.name + ' 合计', b.t, 1);
    }
    return out;
  }

  function toTsv(rows) {
    return rows.map(function (r) { return r.join('\t'); }).join('\n');
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 1900);
  }

  /* 剪贴板在部分客户端会被拒；那时退回到「选中文本」让用户自己按 Cmd+C */
  function copy(text, btn, n) {
    var done = function () {
      toast('已复制 ' + n + ' 行，可直接粘进表格');
      if (btn) { btn.classList.add('ok'); var o = btn.textContent; btn.textContent = '已复制';
        setTimeout(function () { btn.classList.remove('ok'); btn.textContent = o; }, 1900); }
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.className = 'sink'; ta.value = text;
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) { document.body.removeChild(ta); done(); return; }
      ta.classList.remove('sink');
      ta.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;height:40vh;z-index:60';
      ta.select();
      toast('浏览器不允许自动复制 —— 文本已全选，请按 Cmd+C，然后点页面其他地方关闭');
      ta.addEventListener('blur', function () { ta.remove(); });
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }

  /* ── 渲染 ───────────────────────────── */
  var panels = [];

  function render() {
    var days = curDays();
    document.getElementById('daynow').textContent = curLabel();
    app.innerHTML = '';
    if (!days.length) {
      document.getElementById('daysum').textContent = '';
      app.innerHTML = '<section class="panel"><div class="pname">没有数据</div>' +
        '<p class="psvc" style="text-align:left">所选范围内没有已抓取的日期，换个范围试试。</p></section>';
      syncChips(); renderAlerts([]); return;
    }

    panels = panelsOf(aggregate(days));

    // 顶上这行和各块的大数字一样走 ivr 日报口径的漏接，免得两处数对不上
    var tp = 0, tm = 0, to = 0, tom = 0;
    panels.forEach(function (p) {
      tp += p.b.t[A]; tm += Math.max(p.b.t[PM], p.b.mp[IVR]);
      to += p.b.t[OA]; tom += p.b.t[OM];
    });
    document.getElementById('daysum').textContent =
      '全部牌照　电话 ' + tp + ' 接起 / ' + tm + ' 漏接　在线 ' + to + ' 接起 / ' + tom + ' 漏接' +
      (days.length > 1 ? '（' + days.length + ' 天合计）' : '');

    panels.forEach(function (p, pi) {
      var b = p.b, t = b.t;
      var rk = rangeKey(days);
      var ymax = 4;
      b.r.forEach(function (r) { ymax = Math.max(ymax, r[A] + r[PM], r[OA] + r[OM]); });
      /* 顶上的大数字统一走 **ivr 日报口径**：漏接取日报真值（mp[IVR]），
         和源系统、和下面说明里写出去的那句是同一个数。
         上表逐格只装得下「能定位到时段」的那部分漏接，差出来的就是 mp[GAP]，
         所以表里合计那行的接通率会比顶上略高一点，表下面的备注专门说这件事。
         以前顶上走的是逐格口径，于是同一块里 66.6% 和 65.6% 并排出现，自己打自己。 */
      var pmTrue = Math.max(t[PM], b.mp[IVR]);
      var pr = rate(t[A], pmTrue), or_ = rate(t[OA], t[OM]);
      var el = document.createElement('section');
      el.className = 'panel';
      var acc = ACC[p.name] || ACC._;
      el.style.setProperty('--acc-l', acc[0]);
      el.style.setProperty('--acc-d', acc[1]);

      var kpi = function (k, v, bad, sm) {
        return '<div class="kpi"><div class="k">' + k + '</div><div class="v' +
          (bad ? ' bad' : '') + '">' + v + (sm ? ' <em>' + sm + '</em>' : '') + '</div></div>';
      };
      var kpiPA = function (k, ch, ans) {
        var hc = getHc(p.name, ch, p.hc[ch]);
        var lv = getLv(p.name, ch, rk);
        var od = onDuty(hc, lv);
        var v = perAgent(ans, od, b.ad);
        var id = 'pa' + pi + ch;
        var dd = ' data-ch="' + ch + '" data-pa="' + id + '" data-ans="' + ans +
                 '" data-ad="' + b.ad + '" data-p="' + esc(p.name) + '"';
        // 人力和请假并排。请假默认 0，填了才从人力里扣，人均按在岗人力算。
        // 「在岗 N 人」只在真请了假时才出现，平时不占地方。
        return '<div class="kpi"><div class="k">' + k + (days.length > 1 ? '（日均）' : '') +
          '</div><div class="v" id="' + id + '">' + (v === null ? '—' : v) + '</div>' +
          '<div class="hcrow">人力 <input class="hc" type="number" min="0" step="1" value="' +
          (hc || '') + '"' + dd + ' aria-label="' + esc(p.name) + ch + '人力" placeholder="—">' +
          ' <span class="lvlbl' + (lv > 0 ? '' : ' lv0') + '">请假</span> ' +
          '<input class="hc lvin' + (lv > 0 ? '' : ' lv0') + '" type="number" min="0" step="1" value="' +
          (lv || '') + '"' + dd + ' aria-label="' + esc(p.name) + ch + '请假人力" placeholder="0">' +
          ' <span class="od" id="od' + pi + ch + '">' +
          (lv > 0 ? '在岗 ' + od + ' 人' : '人') + '</span></div></div>';
      };

      el.innerHTML =
        '<div class="ptop"><div class="pname">' + esc(p.name) + '</div>' +
        '<div class="psvc">' + svcHtml(p) +
          (p.canSplit ? '<button class="btn sp" style="margin-top:4px" aria-pressed="' +
            (P.split[p.group] ? 'true' : 'false') + '">' +
            (P.split[p.group] ? '合并看' : '拆开单看') + '</button>' : '') +
        '</div></div>' +
        '<div class="kpis">' +
          kpi('电话接通率', pct(pr, 1), pr !== null && pr < D.alert,
              t[A] + ' 接起 / ' + pmTrue + ' 漏接') +
          kpiPA('电话人均接起', 'phone', t[A]) +
          kpi('在线接通率', pct(or_, 1), or_ !== null && or_ < D.alert,
              t[OA] + ' 接起 / ' + t[OM] + ' 漏接') +
          kpiPA('在线人均接起', 'online', t[OA]) +
        '</div>' +
        '<div class="btnrow">' +
          '<button class="btn cp">复制本块时段量</button>' +
          '<span class="hint">制表符分隔，粘进 Excel / 表格自动分列' +
          (p.multi ? '；按牌照分行' : '') + '</span>' +
        '</div>' +
        sumHtml(p, days) +
        table(p) + noteHtml(p) +
        '<div class="charts">' +
          '<div class="ch" data-k="p"><div class="ct">电话</div>' + lgd() +
            chart(b.r, A, PM, PIN, ymax) + '</div>' +
          '<div class="ch" data-k="o"><div class="ct">在线</div>' + lgd() +
            chart(b.r, OA, OM, OIN, ymax) + '</div>' +
        '</div>';
      app.appendChild(el);

      el.querySelector('.cp').addEventListener('click', function (ev) {
        var rows = tsvRows(p, dateCol(days), true);
        copy(toTsv(rows), ev.currentTarget, rows.length - 1);
      });

      var sp = el.querySelector('.sp');
      if (sp) sp.addEventListener('click', function () {
        P.split[p.group] = !P.split[p.group]; savePrefs(); render();
      });

      /* 说明块：数字全是算出来的，改了人力/请假/邮件量都要重算一遍。
         只换 .sum 那一块的内容，不整页 render() —— render 会重建输入框、
         把光标和正在敲的半截字顶掉。 */
      /* ── 红字那行点一下就能改 ────────────────────────────
         自动生成的那句「接通率说明」原来只能看不能动。用户要能改成自己的话
         （2026-10-20）。做法：点一下把这一行换成 textarea，回车/失焦存，
         Esc 放弃。

         覆盖值存在 P.note，键是「牌照|区间|电话或在线」——按区间存，和邮件量、
         原因说明一个脾气（一天一句，不是长期不变）。**改过就整行用改的**，
         不再拼接自动生成的内容，否则人改完又被自动那半句追回来，很乱。

         事件委托挂在 .sum 上：说明块每次 redrawSum 都会重建 DOM，
         直接给每个 div 绑监听会被冲掉。 */
      el.querySelector('.sum').addEventListener('click', function (ev) {
        var div = ev.target.closest('[data-edit]');
        if (!div || div.querySelector('textarea')) return;          // 已经在编辑就不重复开
        var lk = div.dataset.lk || '';
        var key = p.name + '|' + rk + '|' + lk.split('|').slice(1).join('|');
        var old = P.note[key] !== undefined ? P.note[key] : div.textContent;
        var ta = document.createElement('textarea');
        ta.className = 'noteedit';
        ta.value = old;
        div.textContent = '';
        div.appendChild(ta);
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
        var done = function (save) {
          if (save) { P.note[key] = ta.value; savePrefs(); }
          redrawSum();
        };
        ta.addEventListener('blur', function () { done(true); });
        ta.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { e.preventDefault(); done(false); }
          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); done(true); }
        });
      });

      var redrawSum = function () {
        var box = el.querySelector('.sum');
        if (!box) return;
        var tmp = document.createElement('div');
        tmp.innerHTML = sumHtml(p, days);
        box.innerHTML = tmp.querySelector('.sum').innerHTML;
      };

      // 「原因说明」输入框高度跟着内容长 —— 写两行就显示两行，不用自己拖
      var grow = function (ta) {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
      };

      /* 编辑区可能有多行（合并面板按牌照各一行），每行用 data-u 标是哪个牌照。
         两个框都是「边敲边更新说明、离开才存盘」。 */
      el.querySelectorAll('.sumedit[data-u]').forEach(function (row) {
        var un = row.dataset.u;
        var mlIn = row.querySelector('.ml');
        if (mlIn) {
          var mlApply = function (persist) {
            P.ml[un + '|' + rk] = mlIn.value === '' ? '' : Math.max(0, +mlIn.value);
            redrawSum();
            if (persist) savePrefs();
          };
          mlIn.addEventListener('input', function () { mlApply(false); });
          mlIn.addEventListener('change', function () { mlApply(true); });
        }
        var whyIn = row.querySelector('.why');
        if (whyIn) {
          grow(whyIn);
          var whyApply = function (persist) {
            P.why[un + '|' + rk] = whyIn.value;
            grow(whyIn); redrawSum();
            if (persist) savePrefs();
          };
          whyIn.addEventListener('input', function () { whyApply(false); });
          whyIn.addEventListener('change', function () { whyApply(true); });
          whyIn.addEventListener('blur', function () { whyApply(true); });
        }
      });

      var cs = el.querySelector('.cpsum');
      if (cs) cs.addEventListener('click', function (ev) {
        var txt = sumText(p, days);
        copy(txt, ev.currentTarget, txt.split('\n').length);
      });

      // 人力/请假就地改：输入时立刻更新人均数字，离开输入框（或回车）时才存，
      // 省得每敲一下都写一次 localStorage。
      // 两个框算的是同一个人均，所以不管动哪个，都把这一对重新读一遍再算，
      // 而不是只用当前这个框的值 —— 否则改请假时会把人力当成 0。
      // 选择器限定在 .hcrow 内：说明区的「邮件量」框也借用了 .hc 的样式，
      // 但它没有 data-pa，混进来会在 dataset.pa.replace 上抛错。
      // 双技能联动时要防自激：A 改完去敲 B，B 的处理又会回头敲 A。
      // 这个面板级的开关在同步那一下把回敲挡掉（只挡一层，正常输入不受影响）。
      var syncing = false;
      el.querySelectorAll('.hcrow .hc').forEach(function (inp) {
        var isLv = inp.classList.contains('lvin');
        var apply = function (persist) {
          var row = inp.parentNode;
          var hcIn = row.querySelector('.hc:not(.lvin)');
          var lvIn = row.querySelector('.lvin');
          var hc = hcIn && hcIn.value !== '' ? +hcIn.value : 0;
          var lv = lvIn && lvIn.value !== '' ? +lvIn.value : 0;
          var od = onDuty(hc, lv);
          var v = perAgent(+inp.dataset.ans, od, +inp.dataset.ad);
          var tgt = document.getElementById(inp.dataset.pa);
          if (tgt) tgt.textContent = (v === null ? '—' : v);
          var odEl = document.getElementById('od' + inp.dataset.pa.replace(/^pa/, ''));
          if (odEl) odEl.textContent = (lv > 0 ? '在岗 ' + od + ' 人' : '人');
          // 截图模式要藏掉「请假 0」，靠这个类标记；边敲边更新，免得截图时还是旧状态
          var lbl = row.querySelector('.lvlbl');
          if (lvIn) lvIn.classList.toggle('lv0', !(lv > 0));
          if (lbl) lbl.classList.toggle('lv0', !(lv > 0));
          // 说明块里也写着人力和请假，跟着一起重算。
          // P 立刻更新（说明块是从 P 读的，不然边敲边看会显示上一次的值），
          // 只有写进 localStorage 才等到离开输入框 —— 省得每敲一下存一次。
          // 请假按区间存（一天一个数），编制不按（长期不变），所以两个 key 不一样。
          if (isLv) P.lv[p.name + '|' + inp.dataset.ch + '|' + rk] =
            inp.value === '' ? '' : Math.max(0, +inp.value);
          else P.hc[p.name + '|' + inp.dataset.ch] = inp.value === '' ? '' : hc;
          // 双技能块（TBAU/TFNZ）：电话和在线是同一批人，只能有一个人力数。
          // 所以动哪个框，另一个渠道跟着存同一个值 —— 否则「一个人力数」在界面上
          // 还是两个框各填各的，人均会按两个不同的分母算，说明里那句「有效人力 N 人」
          // 也说不清取的是哪个。请假同理。存储格式不变，还是两个 ch 两个键。
          if (p.dual && !syncing) {
            var other = inp.dataset.ch === 'phone' ? 'online' : 'phone';
            if (isLv) P.lv[p.name + '|' + other + '|' + rk] =
              P.lv[p.name + '|' + inp.dataset.ch + '|' + rk];
            else P.hc[p.name + '|' + other] = P.hc[p.name + '|' + inp.dataset.ch];
            // 另一个渠道的框和人均也当场跟上，不等重绘
            var sel = isLv ? '.lvin' : '.hc:not(.lvin)';
            syncing = true;
            try {
              el.querySelectorAll('.hcrow ' + sel).forEach(function (o) {
                if (o !== inp && o.dataset.ch === other) {
                  o.value = inp.value;
                  o.dispatchEvent(new Event('input', { bubbles: true }));
                }
              });
            } finally { syncing = false; }
          }
          redrawSum();
          if (persist) savePrefs();
        };
        inp.addEventListener('input', function () { apply(false); });
        inp.addEventListener('change', function () { apply(true); });
      });

      el.querySelectorAll('.ch').forEach(function (c) {
        var ph = c.dataset.k === 'p';
        c.querySelectorAll('.hit').forEach(function (h) {
          h.addEventListener('mousemove', function (e) {
            var r = b.r[+h.dataset.i];
            var a = ph ? r[A] : r[OA], m = ph ? r[PM] : r[OM];
            showTip(e, '<b>' + esc(D.labels[+h.dataset.i]) + '</b>　' + (ph ? '电话' : '在线') +
              '<br>接起 ' + a + '　漏接 ' + m + '<br>接通率 ' + pct(rate(a, m), 1) +
              ((ph ? r[PIN] : r[OIN]) ? '' : '　非服务时间'));
          });
          h.addEventListener('mouseleave', hideTip);
        });
      });
    });

    renderAlerts(days);
    syncChips();
  }

  function syncChips() {
    var key = mode === 'custom' ? null : (PER[mode][idx[mode]] || {}).key;
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-current', c.dataset.k === key ? 'true' : 'false');
    });
    var last = mode === 'custom' ? 0 : PER[mode].length - 1;
    document.getElementById('prev').disabled = mode === 'custom' || idx[mode] <= 0;
    document.getElementById('next').disabled = mode === 'custom' || idx[mode] >= last;
  }

  function buildStrip() {
    var strip = document.getElementById('strip');
    document.getElementById('customwrap').hidden = (mode !== 'custom');
    if (mode === 'custom') { strip.innerHTML = ''; return; }
    strip.innerHTML = PER[mode].map(function (it) {
      var miss = 0;
      it.days.forEach(function (d) {
        D.data[d].forEach(function (b) { miss += b.t[PM] + b.t[OM]; });
      });
      var top = mode === 'day' ? wdOf(it.key) : it.top;
      var aria = it.label + (mode === 'day' ? ' 周' + top : '（' + it.days.length + ' 天）') +
                 '，漏接 ' + miss;
      return '<button class="chip" role="tab" data-k="' + esc(it.key) +
        '" aria-current="false" aria-label="' + esc(aria) + '">' +
        '<span class="w">' + esc(top) + '</span>' +
        '<span class="d">' + esc(it.label) + '</span>' +
        '<span class="n' + (miss ? ' has' : '') + '">' + (miss || '·') + '</span></button>';
    }).join('');
  }

  function scrollChip() {
    var c = document.querySelector('.chip[aria-current="true"]');
    if (c) c.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('.sg').forEach(function (s) {
      s.setAttribute('aria-pressed', s.dataset.m === m ? 'true' : 'false');
    });
    buildStrip(); render(); scrollChip();
  }

  document.getElementById('strip').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    var i = PER[mode].findIndex(function (it) { return it.key === b.dataset.k; });
    if (i >= 0) { idx[mode] = i; render(); }
  });
  document.getElementById('modes').addEventListener('click', function (e) {
    var b = e.target.closest('.sg');
    if (b) setMode(b.dataset.m);
  });
  document.getElementById('prev').onclick = function () {
    if (idx[mode] > 0) { idx[mode]--; render(); scrollChip(); }
  };
  document.getElementById('next').onclick = function () {
    if (idx[mode] < PER[mode].length - 1) { idx[mode]++; render(); scrollChip(); }
  };

  var cf = document.getElementById('cfrom'), ct = document.getElementById('cto');
  cf.min = ct.min = D.days[0]; cf.max = ct.max = D.days[D.days.length - 1];
  cf.value = custom.from; ct.value = custom.to;
  function onCustom() {
    var a = cf.value, b = ct.value;
    if (!a || !b) return;
    if (a > b) { var t = a; a = b; b = t; cf.value = a; ct.value = b; }
    custom.from = a; custom.to = b; render();
  }
  cf.addEventListener('change', onCustom);
  ct.addEventListener('change', onCustom);

  var shotBtn = document.getElementById('shotbtn');
  function applyShot() {
    document.body.classList.toggle('shot', SHOT);
    shotBtn.setAttribute('aria-pressed', SHOT ? 'true' : 'false');
    shotBtn.textContent = SHOT ? '退出截图模式' : '截图模式';
  }
  shotBtn.onclick = function () { SHOT = !SHOT; applyShot(); };

  /* 一键截图：每个牌照一张 PNG，范围就是整块 .panel —— 上边是带牌照色的面板顶线
     和表头那条色线，下边到两张图表为止，正好是「从表头有颜色的地方到组装图」。

     几个要点，改之前先看一眼：
     · 截图期间临时打开截图模式（藏掉备注/复制按钮），截完恢复原状态，
       这样截出来的图跟「截图模式」看到的一致，用户不用自己先切。
     · scale: 2 出两倍图，贴进文档/钉钉不发虚。
     · backgroundColor 取当前主题的 --surface，不然 html2canvas 给透明底，
       深色主题下贴到白底文档里字会看不见。
     · 一张一张来（await），不并发 —— 四块同时渲染会互相抢布局，图会糊。
     · 文件名带日期和牌照名，批量存下来不会互相覆盖；'+' 换成 '_' 免得某些系统不认。 */
  function shotFile(name) {
    var d = document.getElementById('daynow').textContent.replace(/[^\d\-~]/g, '') || 'report';
    return '时段报表_' + d + '_' + name.replace(/\+/g, '_') + '.png';
  }
  function saveCanvas(cv, fn) {
    var a = document.createElement('a');
    a.download = fn;
    a.href = cv.toDataURL('image/png');
    a.click();
  }
  document.getElementById('shotall').onclick = function (ev) {
    var btn = ev.currentTarget;
    if (typeof html2canvas !== 'function') { toast('截图组件没加载成功'); return; }
    var els = [].slice.call(app.querySelectorAll('.panel'));
    if (!els.length) { toast('当前区间没有数据'); return; }
    var wasShot = SHOT, old = btn.textContent, i = 0;
    document.body.classList.add('shot');
    btn.disabled = true;
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();
    var next = function () {
      if (i >= els.length) {
        document.body.classList.toggle('shot', wasShot);
        btn.disabled = false; btn.textContent = old;
        toast('已存 ' + els.length + ' 张图，看浏览器下载目录');
        return;
      }
      var el = els[i], nm = el.querySelector('.pname').textContent.trim();
      btn.textContent = '正在截 ' + (i + 1) + '/' + els.length + '…';
      html2canvas(el, { backgroundColor: bg, scale: 2, useCORS: true, logging: false })
        .then(function (cv) { saveCanvas(cv, shotFile(nm)); })
        .catch(function (e) { toast('截 ' + nm + ' 失败：' + e.message); })
        .then(function () { i++; setTimeout(next, 120); });
    };
    // 等一下让 .shot 的样式先生效再开截，否则第一张可能还带着备注框。
    // 不用 requestAnimationFrame：页面在后台标签页时浏览器会把它暂停，
    // 那样整批就卡在这儿不动、按钮一直是禁用状态（实测无头模式下它一次都不触发）。
    // setTimeout 不受这个限制，照常走完。
    setTimeout(next, 60);
  };

  document.getElementById('copyday').onclick = function (ev) {
    var days = curDays(), dc = dateCol(days);
    var rows = [TSV_HEAD.slice()];
    panels.forEach(function (p) {
      tsvRows(p, dc, false).forEach(function (r) { rows.push(r); });
    });
    copy(toTsv(rows), ev.currentTarget, rows.length - 1);
  };
  /* ── 我填的内容：导出 / 导入 ──────────────────────────
     为什么要有：人力、请假、邮件量、原因说明都存在**这台机器的浏览器**里
     （localStorage），换电脑、换浏览器、清站点数据就没了。而且做汇总时，
     导出的数据表只含抓来的数，不含这些手填内容。

     做法是「导出成一个文件，需要时再导入」——
        · 导出：把 P 整个存成 JSON 下载，文件名带日期，一眼知道是哪天的备份。
        · 导入：**合并**而不是覆盖（见下），所以可以按周/按月导几份进来累积。
     页面是静态托管的，没有后端，写不回服务器；但有了这个闭环，
     换机器时导一次就能接着用，汇总时也有完整的字段。

     合并规则（每条都选了「宁可不动已有的」那一侧）：
        · 键相同  → 以**本地现有值**为准，不用文件里的（文件是旧的备份，
          本地是你刚敲进去的，后者更新）。想强制覆盖就用文件里的空值留着——
          这一点写在提示里，免得有人以为导入没生效。
        · 键只在文件里有 → 收进来（典型场景：换新电脑，导入旧备份）
        · 键只在本地有   → 保留（典型场景：导入一份上周的备份，不冲掉本周新填的） */
  function prefsSnapshot() {
    return { v: 1, saved_at: new Date().toISOString().slice(0, 16).replace('T', ' '),
             hc: P.hc, lv: P.lv, ml: P.ml, why: P.why, split: P.split,
             note: P.note };
  }
  document.getElementById('exportprefs').onclick = function (ev) {
    var o = prefsSnapshot();
    var n = Object.keys(o.hc).length + Object.keys(o.lv).length +
            Object.keys(o.ml).length + Object.keys(o.why).length;
    if (!n) { toast('还没有填过内容，没什么可导出的'); return; }
    var blob = new Blob([JSON.stringify(o, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '时段报表-我填的内容-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    toast('已导出 ' + n + ' 项（人力/请假/邮件量/原因说明），存到下载文件夹');
  };
  document.getElementById('importprefs').onclick = function () {
    document.getElementById('prefsfile').click();
  };
  document.getElementById('prefsfile').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var o;
      try { o = JSON.parse(r.result); } catch (e) { toast('这个文件读不出来，确认是导出的那份 JSON'); return; }
      if (!o || typeof o !== 'object') { toast('文件内容不是预期的格式'); return; }
      var added = 0;
      ['hc', 'lv', 'ml', 'why', 'split', 'note'].forEach(function (k) {
        var src = o[k]; if (!src || typeof src !== 'object') return;
        Object.keys(src).forEach(function (key) {
          // 本地已有的不动（本地更新），只补文件里独有/本地没有的
          if (!Object.prototype.hasOwnProperty.call(P[k], key) || P[k][key] === '' ||
              P[k][key] === undefined || P[k][key] === null) {
            P[k][key] = src[key]; added++;
          }
        });
      });
      savePrefs(); render();
      toast(added ? '导入完成，补进 ' + added + ' 项；本地已有的保持不变'
                  : '文件里的内容本地都有，没有新增');
    };
    r.readAsText(f);
    ev.target.value = '';        // 同一个文件能再导一次（改完 JSON 重试时用得上）
  });

  /* 「复制全部说明」：五块的说明连起来，就是可以直接发群里的那整段。
     开头带一行日期，和人工写的那份格式一致。 */
  document.getElementById('copysum').onclick = function (ev) {
    var days = curDays();
    if (!days.length) { toast('当前区间没有数据'); return; }
    var head = (days.length === 1 ? days[0] : rangeKey(days)) + ' 接通率说明';
    var txt = [head].concat(panels.map(function (p) { return sumText(p, days); })).join('\n\n');
    copy(txt, ev.currentTarget, txt.split('\n').length);
  };

  document.getElementById('copyall').onclick = function (ev) {
    var rows = [TSV_HEAD.slice()];
    D.days.forEach(function (d) {
      panelsOf(aggregate([d])).forEach(function (p) {
        tsvRows(p, d, false).forEach(function (r) { rows.push(r); });
      });
    });
    copy(toTsv(rows), ev.currentTarget, rows.length - 1);
  };

  document.getElementById('meta').textContent =
    D.days.length + ' 天 · ' + D.days[0] + ' 至 ' + D.days[D.days.length - 1];
  document.getElementById('foot').innerHTML =
    '班次窗口：当日 ' + D.window.start + ' 至次日 ' + D.window.end +
    '，与人工表一致。时段为跨整点的 1 小时（由两个半小时槽位合并），标签如 00:31–01:30。<br>' +
    '接起量、在线漏接量取自报表系统「客户来访数据汇总表（半小时）」；' +
    '电话漏接量另算 ＝ 排队放弃 ＋ 其他漏接，合计以电话报表的 userAbandonCnt ＋ otherAbandonCnt 为准。<br>' +
    '周按一～日切；跨多天时表里是区间内逐时段的累加，人均接起改按「有话务的天数」取日均。<br>' +
    '班表人力和请假人力可直接在页面上填：人均接起按<b>在岗人力＝人力－请假</b>算，请假默认 0。' +
    '两个数只存在这台机器的浏览器里（换机器或清了站点数据要重填），不影响已抓取的数据。<br>' +
    '每块的<b>说明</b>会自动写好（总量、接起、接通率、邮件处理量、人力、漏接集中时段），' +
    '截图里带着；只要人填的只剩「为什么」。<br>' +
    '<b>接通率都按 ivr 日报口径算</b>：顶上的大数字、说明里那句、源系统上看到的，三处是同一个数。' +
    '逐时段表只装得下能定位到具体时段的那部分漏接，可能比日报真值少几通，' +
    '所以表里合计那行的接通率会略高一点 —— 差多少、差在哪，表下面的小字每次都写明。<br>' +
    '<b>邮件处理量</b>自动取自报表系统邮件运营报表（新发＋回复），按牌照按天。' +
    '它只有<b>自然日</b>口径（0:00–24:00），和上面按班次窗口切的「日」差几小时内的量 —— ' +
    '邮件没有更细的时间戳可切，这点差异如实写在这儿，不另作调整；' +
    '要改数的话，说明区填一下邮件量就会盖掉自动值。<br>' +
    'TBHK 和 TBAU＋TFNZ 是<b>双技能</b>：同一批人既接电话又接在线，所以人力只有一个数' +
    '（TBHK 5 人；TBAU＋TFNZ 合并看 4 人、拆开单看各 3 人），改一个框另一个会跟着走。<br>' +
    '区间条上的数字是该区间全部牌照的漏接总量，点击可切换；接通率低于 ' +
    (D.alert * 100).toFixed(0) + '% 的时段标红（和说明里「写原因」的线是同一条）。<br>' +
    '页面最下面的<b>异常提示</b>只在看单日时出现，自动挑出三类值得看一眼的波动：' +
    '某时段话量突然比平时高出一大截、漏接扎堆在一个时段、连续三个时段一路走高。' +
    '「平时大约多少」取同牌照同时段的历史中位数，所以开工时段的正常上涨不会被报。' +
    '没检出就整块不显示，<b>也不进截图</b>。';

  /* 顶部红条：数据没跟上就提醒，跟上了就整条藏起来。
     health 是构建时算好的（build_web.fetch_health）—— 依据是**实际取数结果**，
     不是「凭证文件多久没更新」：文件时间新也可能早失效，旧也可能还能用。 */
  (function () {
    var h = D.health || {};
    var bar = document.getElementById('healthbar');
    if (!bar) return;
    var miss = h.missing || [];
    if (!miss.length) { bar.hidden = true; return; }
    bar.hidden = false;
    var last = D.days.length ? D.days[D.days.length - 1] : '—';
    bar.innerHTML =
      '<span class="hb-t">⚠ 数据没更新到最新</span>' +
      '现在只到 <b>' + last + '</b>，缺 <b>' + miss.length + '</b> 天（' +
      esc(miss.slice(0, 5).join('、')) + (miss.length > 5 ? ' 等' : '') + '）。<br>' +
      '<span class="hb-s">' + esc(h.note || '') + '</span>';
  })();

  applyShot();
  setMode('day');
})();
</script>
</body>
</html>
